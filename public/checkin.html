<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Check-in — Klinov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/publico.css">
</head>
<body>
<header class="pb-top"><span id="clinica">Klinov</span></header>
<main class="pb-main" id="app"><div class="pb-card"><div class="pb-sk"></div><div class="pb-sk" style="width:60%"></div></div></main>
<footer class="pb-rodape">Usamos seus dados só para localizar a consulta de hoje.</footer>
<script>
;(function () {
  'use strict'
  var c = new URLSearchParams(location.search).get('c') || ''
  var app = document.getElementById('app'), clinica = 'Klinov', timer = null
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
  function aviso(titulo, texto, voltar) {
    app.innerHTML = '<div class="pb-card pb-centro"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p>' + (voltar ? '<button class="pb-btn pb-sec" id="volta">Fazer outro check-in</button>' : '') + '</div>'
    if (voltar) { document.getElementById('volta').onclick = formulario; clearTimeout(timer); timer = setTimeout(formulario, 20000) }
  }
  async function api(method, body) {
    var r = await fetch('/api/data?r=publico&acao=checkin' + (method === 'GET' ? '&c=' + encodeURIComponent(c) : ''), { method: method, headers: { 'Content-Type': 'application/json' }, body: method === 'GET' ? undefined : JSON.stringify(body) })
    var j = {}; try { j = await r.json() } catch (e) {}
    return j
  }
  function mascaraCpf(v) { v = v.replace(/\D/g, '').slice(0, 11); return v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2') }
  function formulario() {
    clearTimeout(timer)
    app.innerHTML = '<div class="pb-card"><h1>Check-in</h1><p>Chegou para a sua consulta? Informe seu CPF para avisarmos a equipe.</p>' +
      '<form id="f" novalidate><div id="m-cpf"><label class="pb-lbl" for="cpf">CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00"></div>' +
      '<div id="m-alt" hidden><label class="pb-lbl" for="nasc">Data de nascimento</label><input id="nasc" type="date"><label class="pb-lbl" for="tel">4 últimos dígitos do telefone</label><input id="tel" inputmode="numeric" maxlength="4" autocomplete="off"></div>' +
      '<a href="#" class="pb-link" id="troca">Não tenho o CPF em mãos</a><div id="err" class="pb-err" hidden></div><button class="pb-btn" id="env" type="submit">Fazer check-in</button></form></div>'
    var alt = false, cpf = document.getElementById('cpf')
    cpf.oninput = function () { this.value = mascaraCpf(this.value) }
    document.getElementById('troca').onclick = function (e) {
      e.preventDefault(); alt = !alt
      document.getElementById('m-cpf').hidden = alt; document.getElementById('m-alt').hidden = !alt
      this.textContent = alt ? 'Usar o CPF' : 'Não tenho o CPF em mãos'
    }
    document.getElementById('f').onsubmit = async function (ev) {
      ev.preventDefault()
      var err = document.getElementById('err'), btn = document.getElementById('env'); err.hidden = true
      var body = alt ? { c: c, nascimento: document.getElementById('nasc').value, telefone: document.getElementById('tel').value } : { c: c, cpf: cpf.value }
      if (!alt && cpf.value.replace(/\D/g, '').length !== 11) { err.textContent = 'Digite os 11 números do CPF.'; err.hidden = false; return }
      btn.disabled = true; btn.textContent = 'Procurando sua consulta…'
      var r = await api('POST', body).catch(function () { return {} })
      if (!r.success) { btn.disabled = false; btn.textContent = 'Fazer check-in'; err.textContent = r.error || 'Não foi possível fazer o check-in. Procure a recepção.'; err.hidden = false; return }
      var det = 'Sua consulta é às ' + r.hora + (r.profissional ? ' com ' + r.profissional : '') + '. '
      aviso(r.ja ? r.nome + ', seu check-in já está feito' : 'Pronto, ' + r.nome + '!', det + 'Aguarde, você será chamado(a) em instantes.', true)
    }
  }
  ;(async function () {
    if (!c) return aviso('QR Code inválido', 'Procure a recepção.')
    var d = await api('GET').catch(function () { return {} })
    if (!d.success) return aviso('Check-in indisponível', d.error || 'Procure a recepção.')
    clinica = d.clinica; document.getElementById('clinica').textContent = clinica; document.title = 'Check-in — ' + clinica
    formulario()
  })()
})()
</script>
</body>
</html>
